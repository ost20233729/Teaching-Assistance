spring.application.name=backend

spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=/upload/

spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=${TEACHING_DB_URL:jdbc:mysql://localhost:3306/teaching_assistance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${TEACHING_DB_USERNAME:root}
spring.datasource.password=${TEACHING_DB_PASSWORD:}

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

openai.api-url=${OPENAI_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
openai.model-name=${OPENAI_MODEL:qwen-plus}
openai.api-key=${OPENAI_API_KEY:}


spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
